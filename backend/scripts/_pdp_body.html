<div class="mg-pdp" style="max-width:1320px;margin:0 auto;padding:24px 20px 40px">
  <div class="mg-breadcrumbs"><a href="/store">Home</a><span class="sep">/</span><a href="/store/products">Shop</a><span class="sep">/</span><span style="color:var(--mg-fg)" id="pdpCrumb">Product</span></div>
  <div class="mg-pdp-grid" id="pdpGrid" style="display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:start">
    <div class="mg-pdp-gallery" style="display:block">
      <div class="mg-pdp-main" data-gallery><img id="mainImg" class="is-active" src="" alt="" style="opacity:1;max-width:82%;max-height:82%"></div>
      <div class="mg-pdp-thumbs" id="thumbs" style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap"></div>
    </div>
    <div class="mg-pdp-info">
      <span class="mg-eyebrow" id="pType"></span>
      <h1 id="pTitle" style="font-family:var(--mg-font-display);font-weight:800;font-size:clamp(28px,4vw,48px);line-height:1.02;letter-spacing:-.02em;text-transform:uppercase;margin:8px 0 12px;text-wrap:balance"></h1>
      <h2 id="pSub" style="font-family:var(--mg-font-body);font-weight:400;font-size:16px;line-height:1.55;color:var(--mg-iron-500);margin:0 0 16px;max-width:540px"></h2>
      <div class="mg-pdp-rating" style="display:flex;gap:14px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
        <span style="display:inline-flex;align-items:center;gap:4px;color:var(--mg-success);font-family:var(--mg-font-mono);font-size:11px;font-weight:700">✓ In stock · ships in 24h</span>
        <span class="mg-pdp-sku" id="pSku" style="font-family:var(--mg-font-mono);font-size:11px;color:var(--mg-iron-500)"></span>
      </div>
      <div class="mg-pdp-price" style="display:flex;align-items:baseline;gap:12px;margin:6px 0 8px">
        <span id="pPrice" style="font-family:var(--mg-font-display);font-weight:800;font-size:38px;color:var(--mg-fg)"></span>
        <span id="pWas" style="text-decoration:line-through;color:var(--mg-iron-400);font-size:20px"></span>
        <span id="pPct" style="background:var(--mg-orange-soft);color:var(--mg-orange-deep);font-weight:700;padding:3px 9px;border-radius:6px;font-size:13px"></span>
      </div>
      <div class="mg-pdp-emi" id="pEmi" style="display:flex;align-items:center;gap:8px;color:var(--mg-iron-500);font-size:13px;margin-bottom:18px">⚡ EMI from <b id="emiVal" style="color:var(--mg-fg)"></b>/mo · 12 months · No-cost EMI available</div>
      <div class="mg-pdp-qty-row" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <div class="mg-pdp-qty" style="display:flex;align-items:center;border:1px solid var(--mg-iron-200);border-radius:10px;overflow:hidden">
          <button type="button" id="qtyDec" style="padding:12px 16px;background:none;border:none;cursor:pointer;font-size:18px">−</button>
          <span id="qtyVal" style="min-width:36px;text-align:center;font-weight:700">1</span>
          <button type="button" id="qtyInc" style="padding:12px 16px;background:none;border:none;cursor:pointer;font-size:18px">+</button>
        </div>
        <button class="mg-btn mg-btn-primary" id="addBtn" style="flex:1;min-width:180px">Add to cart</button>
        <button class="mg-btn mg-btn-secondary" id="buyBtn">⚡ Buy now</button>
      </div>
      <div class="mg-pdp-trust" style="display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:24px">
        <div class="mg-pdp-trust-item" style="display:flex;gap:10px;align-items:center">🛡 <div><b>5-Year warranty</b><br><span style="color:var(--mg-iron-500);font-size:12px">Hassle-free claim</span></div></div>
        <div class="mg-pdp-trust-item" style="display:flex;gap:10px;align-items:center">🚚 <div><b>Free shipping</b><br><span style="color:var(--mg-iron-500);font-size:12px">Pan-India · 5–7 days</span></div></div>
        <div class="mg-pdp-trust-item" style="display:flex;gap:10px;align-items:center">🏅 <div><b>BIS Certified</b><br><span style="color:var(--mg-iron-500);font-size:12px">IS 16242 standard</span></div></div>
        <div class="mg-pdp-trust-item" style="display:flex;gap:10px;align-items:center">📞 <div><b>24×7 Support</b><br><span style="color:var(--mg-iron-500);font-size:12px">099990 36254</span></div></div>
      </div>
    </div>
  </div>
  <section class="mg-spec-section" style="max-width:900px;margin:48px auto 0">
    <h2 style="font-family:var(--mg-font-display);font-weight:800;font-size:24px;text-transform:uppercase;margin-bottom:12px">Description</h2>
    <div id="pDesc" style="color:var(--mg-iron-700);line-height:1.7"></div>
  </section>
</div>
